<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Weather Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }
        h1 { color: #333; font-size: 22px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .weather-result { text-align: left; background: #e9ecef; padding: 15px; border-radius: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud Weather Dashboard ☁️</h1>
        <p class="subtitle">Instant weather forecasting</p>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city...">
            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weatherResult" class="weather-result hidden">
            <h3 id="cityName" style="margin-top:0;"></h3>
            <p id="temp"></p>
            <p id="condition"></p>
            <p id="humidity"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
